<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- A 3x3 sudoku box with the picked cell in the game's red. -->
  <style>
    rect { fill: #1a212b; }
    rect.pick { fill: #e8443a; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #e8ecf1; }
      rect.pick { fill: #ff6b5e; }
    }
  </style>
  <rect x="0.5" y="0.5" width="4.4" height="4.4" rx="1"/>
  <rect x="5.8" y="0.5" width="4.4" height="4.4" rx="1"/>
  <rect x="11.1" y="0.5" width="4.4" height="4.4" rx="1"/>
  <rect x="0.5" y="5.8" width="4.4" height="4.4" rx="1"/>
  <rect class="pick" x="5.8" y="5.8" width="4.4" height="4.4" rx="1"/>
  <rect x="11.1" y="5.8" width="4.4" height="4.4" rx="1"/>
  <rect x="0.5" y="11.1" width="4.4" height="4.4" rx="1"/>
  <rect x="5.8" y="11.1" width="4.4" height="4.4" rx="1"/>
  <rect x="11.1" y="11.1" width="4.4" height="4.4" rx="1"/>
</svg>
