[package]
name = "rust-sudoku-api"
version = "0.2.0"
authors = ["Richard Hess <eswat2@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/eswat2/proto-sudoku-cf"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# rlib lets benches/ link the crate natively
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8"
base64 = "0.22.0"
serde_json = "1.0.64"
sudoku = "0.8.0"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "puzzle"
harness = false

[profile.release]
opt-level = "s"
lto = true
