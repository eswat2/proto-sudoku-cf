<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="prototype - a simple Web Component Sudoku demo generated with Stencil"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ProtoSudoku SUDOKU -- local</title>
    <link 
      rel="stylesheet" 
      href="https://_CDN/proto-sudoku-wc@SUDOKU/dist/proto-sudoku-wc/props.css" />
    <script
      type="module"
      src="https://_CDN/proto-sudoku-wc@SUDOKU/dist/proto-sudoku-wc/proto-sudoku-wc.esm.js"
    ></script>
    <style>
      /* A muted page with the game on a white card. The component has no
         background of its own, so its cells take the card's white. */
      html, body { margin: 0; background: #e4e7ec; }
      body { padding: 24px 16px; }
      proto-sudoku {
        display: block;
        width: fit-content;
        margin: 0 auto;
        background: #fff;
        border-radius: 14px;
        padding: 12px 14px 16px;
        box-shadow: 0 1px 2px rgba(20, 23, 31, 0.06), 0 8px 24px rgba(20, 23, 31, 0.08);
      }
      /* Phones: the card plus its padding is wider than the screen, so drop
         the card and let the game sit on plain white, edge to edge. */
      @media (max-width: 439px) {
        html, body { background: #fff; }
        body { padding: 8px 0; }
        proto-sudoku { width: auto; max-width: fit-content; border-radius: 0; box-shadow: none; padding: 0; }
      }
    </style>
  </head>
  <body>
    <proto-sudoku platform="cloudflare"/>
  </body>
</html>
